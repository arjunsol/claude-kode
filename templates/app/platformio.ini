; PlatformIO project configuration for a Kode Dot (ESP32-S3) kodeOS app.
; Board id "kode_dot" resolves against boards/kode_dot.json in this project
; (PlatformIO custom-board convention). See skills/kode-dot-dev/SKILL.md
; for background and sources.

[platformio]
default_envs = kode_dot

[env:kode_dot]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = kode_dot
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; kodeOS identifies the flashed app by this name in the launcher, until a
; real manifest format is documented - see skills/kode-dot-dev/SKILL.md.
app_name = MyKodeApp

extra_scripts = pre:extra_scripts/rename_bin.py

; kodeOS keeps its own bootloader/launcher in the low flash region and
; expects each app's firmware image flashed at 0x400000, so upload writes
; there directly instead of using the normal whole-image upload. See
; partitions_app.csv for the full layout this depends on.
upload_protocol = custom
upload_port = auto
upload_speed = 460800
upload_command = esptool --chip esp32s3 --port ${UPLOAD_PORT} --baud ${UPLOAD_SPEED} write-flash --flash-freq 80m --flash-mode dio --flash-size 32MB 0x400000 ${BUILD_DIR}/${PROGNAME}.bin

lib_deps =
    adafruit/Adafruit NeoPixel
