; ARCHIVE ONLY: unreleased ESP32-S3 prototype, build-only. Not a P4/C5 target.
; Board id "kode_dot" resolves against boards/kode_dot.json in this project
; (PlatformIO custom-board convention). See skills/kode-dot-dev/SKILL.md
; for background and sources.

[platformio]
default_envs = kode_dot

[env:kode_dot]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = kode_dot
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; Historical binary filename only; not a production loader manifest.
app_name = MyKodeApp

extra_scripts =
    pre:extra_scripts/build_only.py
    pre:extra_scripts/rename_bin.py

; No deployment recipe is retained. The pre-script rejects non-build targets.
lib_deps =
    adafruit/Adafruit NeoPixel
